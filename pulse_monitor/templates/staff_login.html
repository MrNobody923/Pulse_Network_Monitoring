<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Vertex Sentry</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/vertex-sentry-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #091220;
      --card: #101c30;
      --border: #22344f;
      --text: #e8eef8;
      --muted: #8fa1bc;
      --cyan: #22d3ee;
      --btn: #0284c7;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #12233d 0%, var(--bg) 65%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 410px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand-row img {
      border-radius: 10px;
      flex-shrink: 0;
    }
    .brand-row h1 {
      margin: 0;
      font-size: 1.32rem;
      letter-spacing: -0.02em;
    }
    .brand-row p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .field { margin-bottom: 15px; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #0a1424;
      color: var(--text);
      font-size: 0.95rem;
    }
    .input-wrap input {
      padding-right: 66px;
    }
    .field input:focus {
      outline: 2px solid var(--cyan);
      border-color: transparent;
    }
    .pw-toggle {
      position: absolute;
      right: 8px;
      width: auto;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #14243d;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pw-toggle:hover {
      color: var(--text);
      border-color: var(--cyan);
    }
    .error-box {
      margin: 0 0 16px;
      padding: 11px 13px;
      border-radius: 9px;
      border: 1px solid rgba(248, 113, 113, 0.42);
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .error-box p { margin: 0; }
    .error-box p + p { margin-top: 4px; }
    .submit-btn {
      width: 100%;
      margin-top: 4px;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--btn);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-row">
      <img src="/vertex-sentry-192.png" width="42" height="42" alt="">
      <div>
        <h1>Vertex Sentry</h1>
        <p>Staff &amp; Administrator Sign In</p>
      </div>
    </div>

    {% if csrf_error %}
    <div class="error-box" role="alert">
      <p>{{ csrf_error }}</p>
    </div>
    {% elif form.errors %}
    <div class="error-box" role="alert">
      {% for err in form.non_field_errors %}
        <p>{{ err }}</p>
      {% empty %}
        <p>Please enter both your staff username and password.</p>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'staff-login' %}">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="field">
        <label for="id_username">Username</label>
        <input
          type="text"
          name="username"
          id="id_username"
          value="{{ form.username.value|default:'' }}"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          {% if not form.username.value %}autofocus{% endif %}
          required
        >
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            name="password"
            id="id_password"
            autocomplete="current-password"
            {% if form.username.value %}autofocus{% endif %}
            required
          >
          <button type="button" class="pw-toggle" id="btnTogglePw" aria-controls="id_password" aria-pressed="false">Show</button>
        </div>
      </div>
      <button type="submit" class="submit-btn">Sign in</button>
    </form>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('btnTogglePw');
      var input = document.getElementById('id_password');
      if (!btn || !input) return;
      btn.addEventListener('click', function () {
        var showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.textContent = showing ? 'Show' : 'Hide';
        btn.setAttribute('aria-pressed', String(!showing));
        input.focus();
      });
    })();
  </script>
</body>
</html>
